<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000">
    <title>Gallery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" 
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" 
    crossorigin="anonymous" referrerpolicy="no-referrer" />

    

    <style>
        :root {
            --nudge: 60px;
            --oldbg: #e9e3d7;
            --butter: #f5d365;
            --bg:#ffffff;
            --ink:#23343b;
            --paper: #ffffff;
            --shadow: 0 6px 16px rgba(43,47,61,.14);
        }
        * {box-sizing: border-box;}
        html { -webkit-text-size-adjust: 100%; }

        html { scroll-behavior: smooth; }
        #allHeading {scroll-margin-top: 20px;}

        .scrollcue{
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: calc(15svh + 28px + env(safe-area-inset-bottom));
            z-index: 10;

            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;

            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.14em;
            white-space: nowrap;

            border: 1.5px solid rgba(255,255,255,.9);
            border-radius: 999px;                 /* the oval */
            background: rgba(0,0,0,.25);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            -webkit-tap-highlight-color: transparent;
        }
        .scrollcue i { font-size: 14px; animation: cue-bob 1.8s ease-in-out infinite; }

        @keyframes cue-bob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(3px); }
        }
        @media (prefers-reduced-motion: reduce) {
            .scrollcue i { animation: none; }
        }

        @font-face {
            font-family: "PPEditorial";
            src: url("./Fonts/PPEditorialNew-Regular.otf") format("opentype");
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Fredoka', system-ui, sans-serif;
        }
        .page{
            width: min(100%, 440px);
            margin: 0 auto;
        }
        header{text-align: center; margin-bottom: 18px;}
        h1{margin: 0; font-size: 30px; font-weight: 600; letter-spacing: 0.1em;}

        /* --- ALL PHOTOS --- */
        h2{text-align: center; margin: 0 0 12px; font-size:20px; font-weight:500;}
        .grid{
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 10px;
        }
        .thumb{
            padding:0; border:0;
            aspect-ratio: 9/16;
            border-radius: 0px;
            overflow:hidden;
            background: var(--paper);
            box-shadow: var(--shadow);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .thumb img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .allHeading{
            padding: 28px 18px 48px;
        }
        .thumb[aria-current="true"]{
            outline: 3px solid var(--butter); outline-offset: 2px;
        }
        .mainimagecontainer{
            position: relative;
            width: 100%;
            height: calc(115svh + var(--nudge));
            justify-content: center;
            align-items: center;
            background-color: #000;
            display: block;
            touch-action: pan-y;
            -webkit-user-select: none;
            user-select: none;
        }

        .mainimagecontainer::after {
            content: "";
            position: absolute;
            inset: auto 0 0 0;
            height: 55%;
            background: linear-gradient(to top, rgba(0,0,0,.45), transparent);
            transition: opacity .25s ease;
        }
        .mainimagecontainer.is-fading::after{
            opacity: 0;
        }

        .mainimage{
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity .25s ease;
            -webkit-user-drag: none;
        }

        @media screen and (min-width: 700px) and (max-width: 1023px){
            .page{ width: min(100%, 800px); }
            .grid{ grid-template-columns: repeat(3, 1fr); }
        }

        @media screen and (min-width: 1024px){
            .mainimage{object-position: center 40%;}
            .mainimagecontainer{height: calc(100svh + var(--nudge));}
            .page{width:min(100%, 1200px);}
            .grid{grid-template-columns: repeat(4,1fr); gap: 16px;}
        }

        @media screen and (min-width:1460px) and (max-width:1799px){
            .page{width:min(100%, 1400px);}
            .grid{grid-template-columns: repeat(5,1fr);}
        }
        
        @media screen and (min-width: 1800px){
            .page{width:min(100%, 1700px);}
            .grid{grid-template-columns: repeat(6,1fr);}
        }

        .mainimage.is-fading{opacity: 0;}

        .hero-title {
            position: absolute;
            left: 0; right: 0;
            /* sits just above the scroll button, measured from the visible bottom */
            bottom: calc(15svh + 100px + env(safe-area-inset-bottom));
            z-index: 10;
            text-align: center;
            color: #fff;
            text-shadow: 0 2px 18px rgba(0,0,0,.35);
            pointer-events: none;
        }
        .hero-title .eyebrow {
            margin: 0 0 8px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.32em;
            opacity: .9;
        }
        .hero-title h1 {
            margin: 0;
            font-family: 'PPEditorial', Georgia, serif;
            text-shadow: 0 2px 18px rgba(0,0,0,.35);
            font-size: clamp(44px, 14vw, 64px);
            font-weight: 400;
            line-height: 1;
            letter-spacing: -0.01em;
        }
        
        .allHeading, section[aria-labelledby="allHeading"] {
            padding: 28px calc(18px + env(safe-area-inset-right))
            calc(48px + env(safe-area-inset-bottom))
            calc(18px + env(safe-area-inset-left));
        }
    </style>

</head>
<body>
    <div class="mainimagecontainer">
        <img class="mainimage" alt="Main Image">
        <a class="scrollcue" href="#allHeading">
        <span>SCROLL FOR MORE</span>
        <i class="fa-solid fa-arrow-down" aria-hidden="true"></i>
    </a>
        <div class="hero-title">
            <p class="eyebrow">PHOTOGRAPHY</p>
            <h1>Zac Petty</h1>
        </div>
    </div>
   
    <div class="rounds">
        
    </div>
    <main class="page">
        

        <section aria-labelledby="allHeading">
            <h2 id="allHeading">ALL PHOTOS</h2>
            <div class="grid" id="grid"></div>
        </section>
    </main>

    <script>
    let index = 9;
    let req = 0;
    
    const photo = document.querySelector('.mainimage');
    const stage = document.querySelector('.mainimagecontainer');
       
    const NUDGE = 60; // keep in sync with --nudge
    history.scrollRestoration = 'manual';

    function nudge() { if (window.scrollY < NUDGE) window.scrollTo(0, NUDGE); }

    window.addEventListener('load', () => requestAnimationFrame(nudge));
    window.addEventListener('scroll', () => {
        if (window.scrollY < NUDGE) requestAnimationFrame(nudge);
    }, { passive: true });

    const THUMBNAILS = [
        {src: 'Images/NewGallery/1small.webp', title: '1small', alt: '1small'},
        {src: 'Images/NewGallery/2small.webp', title: '2small', alt: '2small'},
        {src: 'Images/NewGallery/3small.webp', title: '3small', alt: '3small'},
        {src: 'Images/NewGallery/4small.webp', title: '4small', alt: '4small'},
        {src: 'Images/NewGallery/5small.webp', title: '5small', alt: '5small'},
        {src: 'Images/NewGallery/6small.webp', title: '6small', alt: '6small'},
        {src: 'Images/NewGallery/7small.webp', title: '7small', alt: '7small'},
        {src: 'Images/NewGallery/8small.webp', title: '8small', alt: '8small'},
        {src: 'Images/NewGallery/9small.webp', title: '9small', alt: '9small'},
        {src: 'Images/NewGallery/10small.webp', title: '10small', alt: '10small'},
        {src: 'Images/NewGallery/11small.webp', title: '11small', alt: '11small'},
        {src: 'Images/NewGallery/12small.webp', title: '12small', alt: '12small'},
        {src: 'Images/NewGallery/13small.webp', title: '13small', alt: '13small'},
        {src: 'Images/NewGallery/14small.webp', title: '14small', alt: '14small'},
        {src: 'Images/NewGallery/15small.webp', title: '15small', alt: '15small'},
        {src: 'Images/NewGallery/16small.webp', title: '16small', alt: '16small'},
        {src: 'Images/NewGallery/17small.webp', title: '17small', alt: '17small'},
        {src: 'Images/NewGallery/18small.webp', title: '18small', alt: '18small'},
        {src: 'Images/NewGallery/19small.webp', title: '19small', alt: '19small'},
        {src: 'Images/NewGallery/20small.webp', title: '20small', alt: '20small'},
        {src: 'Images/NewGallery/21small.webp', title: '21small', alt: '21small'},
        {src: 'Images/NewGallery/22small.webp', title: '22small', alt: '22small'},
        {src: 'Images/NewGallery/23small.webp', title: '23small', alt: '23small'},
        {src: 'Images/NewGallery/24small.webp', title: '24small', alt: '24small'},
        {src: 'Images/NewGallery/25small.webp', title: '25small', alt: '25small'},
    ];
        
    const PHOTOS = [
        { src: 'Images/NewGallery/1.webp', title: '1', alt: '1',pos: 'center 35%' },
        { src: 'Images/NewGallery/2.webp', title: '2', alt: '2',pos: 'center 27%' },
        { src: 'Images/NewGallery/3.webp', title: '3', alt: '1',pos: 'center 27%' },
        { src: 'Images/NewGallery/4.webp', title: '4', alt: '1',pos: 'center 53%' },
        { src: 'Images/NewGallery/5.webp', title: '5', alt: '1',pos: 'center 25%' },
        { src: 'Images/NewGallery/6.webp', title: '6', alt: '1',pos: 'center 30%' },
        { src: 'Images/NewGallery/7.webp', title: '7', alt: '1',pos: 'center 25%' },
        { src: 'Images/NewGallery/8.webp', title: '8', alt: '1',pos: 'center 15%' },
        { src: 'Images/NewGallery/9.webp', title: '9', alt: '1', pos: 'center 5%' },
        { src: 'Images/NewGallery/10.webp', title: '10', alt: '1',pos: 'center 40%' },
        { src: 'Images/NewGallery/11.webp', title: '11', alt: '1',pos: 'center 27%' },
        { src: 'Images/NewGallery/12.webp', title: '12', alt: '1',pos: 'center 15%' },
        { src: 'Images/NewGallery/13.webp', title: '13', alt: '1',pos: 'center 28%' },
        { src: 'Images/NewGallery/14.webp', title: '14', alt: '1',pos: 'center 15%' },
        { src: 'Images/NewGallery/15.webp', title: '15', alt: '15',pos: 'center 22%' },
        { src: 'Images/NewGallery/16.webp', title: '16', alt: '16',pos: 'center 25%' },
        { src: 'Images/NewGallery/17.webp', title: '17', alt: '17',pos: 'center 45%' },
        { src: 'Images/NewGallery/18.webp', title: '18', alt: '18',pos: 'center 40%' },
        { src: 'Images/NewGallery/19.webp', title: '19', alt: '19',pos: 'center 25%' },
        { src: 'Images/NewGallery/20.webp', title: '20', alt: '20',pos: 'center 40%' },
        { src: 'Images/NewGallery/21.webp', title: '21', alt: '21',pos: 'center 25%' },
        { src: 'Images/NewGallery/22.webp', title: '22', alt: '22',pos: 'center 35%' },
        { src: 'Images/NewGallery/23.webp', title: '23', alt: '23',pos: 'center 35%' },
        { src: 'Images/NewGallery/24.webp', title: '24', alt: '24',pos: 'center 55%' },
        { src: 'Images/NewGallery/25.webp', title: '25', alt: '25',pos: 'center 40%' },
    ];
    const $ = id => document.getElementById(id);

    function show(i) {
        index = (i + PHOTOS.length) % PHOTOS.length;
        const p = PHOTOS[index];
        const mine = ++req;
        stage.classList.add('is-fading');
        photo.classList.add('is-fading');
        // Wait for the fadeout to finish and the new image to be ready.
        const fadeOut = new Promise(r => setTimeout(r,250));
        const next = new Image();
        next.src = p.src;
        const ready = next.decode().catch(() => {})

        Promise.all([fadeOut, ready])
            .then(() => {
                if (mine !== req) return; // a newer swipe took over
                photo.src = p.src;
                photo.style.objectPosition = p.pos || '';
                photo.alt = p.alt || p.title || '';
                stage.classList.remove('is-fading');
                photo.classList.remove('is-fading');
            });
        
        document.querySelectorAll('.thumb').forEach((t,n) =>
            t.setAttribute('aria-current', n === index));
        // Preload neighboring images so the next swipe is instant.
        [index + 1].forEach(n => {
            new Image().src = PHOTOS[(n + PHOTOS.length) % PHOTOS.length].src;
        })
    }
    const go = d => show(index + d);

    function buildGrid() {
    THUMBNAILS.forEach((p, n) => {
        const b = document.createElement('button');
        b.className = 'thumb';
        b.setAttribute('aria-label', `Show ${p.title || 'photo ' + (n + 1)} on the camera`);
        const im = document.createElement('img');
        im.src = p.src; im.alt = ''; im.loading = 'lazy';
        b.appendChild(im);
        b.addEventListener('click', () => {
            show(n);
            const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
            window.scrollTo({ top: NUDGE, behavior: calm ? 'auto' : 'smooth' });
        });
        $('grid').appendChild(b);
    });
    }
    buildGrid();

    function showInstant(i){
        index = (i + PHOTOS.length) % PHOTOS.length;
        const p = PHOTOS[index];
        photo.src = p.src;
        photo.style.objectPosition = p.pos || '';
        photo.alt = p.alt || p.title || '';
        document.querySelectorAll('.thumb').forEach((t,n) =>
            t.setAttribute('aria-current', n === index));
    }
    showInstant(index);

    // SWIPE CONTROLS
    let sx = 0, sy = 0, tracking = false;

    stage.addEventListener('pointerdown', e => {
        sx=e.clientX;
        sy=e.clientY;
        tracking=true;
    })

    stage.addEventListener('pointerup', e =>{
        if (!tracking) return;
        tracking = false;
        const dx = e.clientX - sx, dy = e.clientY - sy;
        // must be a deliberate mostly horizontal swipe
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5){
            go(dx < 0 ? 1 : -1); // swipe left = next, swipe right = previous
        }
    })
    stage.addEventListener('pointercancel', () => {tracking = false});
    //arrow keys on desktop
    window.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight') go(1);
        if (e.key === 'ArrowLeft') go(-1);
    })

    </script>
</body>
</html>
